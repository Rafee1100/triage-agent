[project]
name = "triagepilot-server"
version = "0.1.0"
description = "TriagePilot backend — multi-agent PR ranking API (FastAPI on Fly.io)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "anthropic>=0.39",
    "python-telegram-bot>=21.6",
    "apscheduler>=3.10",
    "scipy>=1.14",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
